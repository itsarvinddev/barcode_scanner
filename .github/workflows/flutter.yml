name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        # `flutter format` was removed from the SDK; `dart format` replaces it.
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  pana:
    name: pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Publish dry run
        run: flutter pub publish --dry-run
      - name: pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

  build-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example

  build-web:
    name: Build example (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build web
        working-directory: example

  build-apple:
    name: Build example (iOS & macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --debug --no-codesign
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
