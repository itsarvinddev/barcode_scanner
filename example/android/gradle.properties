org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Flipping it to `true` opts into AGP 9's built-in Kotlin and removes the
# app-level KGP warning, but it does NOT silence the "plugins that apply KGP:
# mobile_scanner" line — Flutter detects that by text-scanning the plugin's
# build.gradle, so the guarded `apply plugin` inside mobile_scanner still
# matches. See the Troubleshooting section of the README.
android.builtInKotlin=false

# Uncomment to use the unbundled (Google Play Services) MLKit barcode model
# instead of the bundled one. Saves ~3-10 MB of app size, but the model is
# downloaded on first use.
# dev.steenbakker.mobile_scanner.useUnbundled=true
