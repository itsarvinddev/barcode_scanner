name: ai_barcode_scanner
description: A universal AI barcode and QR code scanner for Flutter based on MLKit. Uses CameraX on Android, AVFoundation on iOS and Apple Vision & AVFoundation on macOS.
version: 8.0.1
homepage: https://mohesu.com
repository: https://github.com/itsarvinddev/barcode_scanner.git
issue_tracker: https://github.com/itsarvinddev/barcode_scanner/issues
screenshots:
  - description: "AI Barcode Scanner"
    path: assets/ai_barcode_scanner.png
  - description: "UI Customization"
    path: assets/IMG_5359.png

topics:
  - qr-code
  - barcode
  - scanner
  - camera
  - mobile-scanner

environment:
  # Floor set by mobile_scanner 7.4.0, which the scanner wraps.
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Lower bound kept deliberately loose: image_picker 1.2.3 requires Flutter
  # 3.38, so a caret constraint would drag the whole package's floor up with
  # it. This lets pub pick the newest image_picker each SDK can actually run.
  image_picker: ">=1.1.2 <2.0.0"
  mobile_scanner: ">=7.4.1 <8.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
