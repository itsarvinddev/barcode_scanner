name: ai_barcode_scanner
description: "Barcode and QR code scanner for Flutter on Android, iOS, macOS and the web: a full-screen or embedded scanner UI in one call, built on mobile_scanner."
version: 8.2.0
homepage: https://mohesu.com
repository: https://github.com/itsarvinddev/barcode_scanner.git
issue_tracker: https://github.com/itsarvinddev/barcode_scanner/issues
screenshots:
  - description: "Scan any barcode or QR code: a full-screen scanner in one line of code."
    path: assets/readme/pubdev_1.webp
  - description: "Results you can act on: links, Wi-Fi, contacts and more, parsed and ready."
    path: assets/readme/pubdev_2.webp
  - description: "Make it yours: brand colours, copy, scan window and controls."
    path: assets/readme/pubdev_3.webp
  - description: "Embed it anywhere: drop the scanner into your own screens and forms."
    path: assets/readme/pubdev_4.webp

topics:
  - qr-code
  - barcode
  - scanner
  - camera
  - mobile-scanner

environment:
  # Floor set by mobile_scanner 7.4.0, which the scanner wraps.
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Lower bound kept deliberately loose: image_picker 1.2.3 requires Flutter
  # 3.38, so a caret constraint would drag the whole package's floor up with
  # it. This lets pub pick the newest image_picker each SDK can actually run.
  image_picker: ">=1.1.2 <2.0.0"
  mobile_scanner: ">=7.4.1 <8.0.0"
  # Used by the web still-image decoder. Already required by mobile_scanner
  # with the same constraint, so this adds nothing to the resolution.
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
