# The README media renderer is a private tool, not part of the published
# package, so it is excluded from the root analysis (see
# ../../analysis_options.yaml) and checked here on its own:
#
#   cd tool/readme_media && flutter analyze --fatal-infos

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - compose/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cascade_invocations
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
