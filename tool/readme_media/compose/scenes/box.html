<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Camera scene: the underside of a white retail box on a slate desk, with an
  EAN-13 barcode and a Code 128 serial number.

  Rendered at 1080x1920 CSS px (a portrait camera frame) by ../scenes.mjs. The
  EAN-13's centre is kept near (540, 945), inside the wide scan window the
  scanner picks when it is restricted to linear formats.
-->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2a2d31; }
  * { box-sizing: border-box; }
  .frame { position: absolute; inset: 0; overflow: hidden; perspective: 2400px; perspective-origin: 540px 950px; }

  .desk {
    position: absolute; inset: -100px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='2120'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.8  0 0 0 0 0.82  0 0 0 0 0.85  0 0 0 0.16 0'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='2120'><filter id='d'><feTurbulence type='fractalNoise' baseFrequency='0.004' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 0 0.07  0 0 0 0.7 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23d)'/></svg>"),
      linear-gradient(150deg, #474c53 0%, #3a3e44 50%, #2c2f34 100%);
  }

  .box {
    position: absolute; left: 110px; top: 305px; width: 860px; height: 1560px;
    transform: rotateX(14deg) rotate(4deg); transform-origin: 430px 725px;
  }
  .box-shadow { position: absolute; inset: 0; border-radius: 14px;
    box-shadow: 30px 50px 90px rgba(0, 0, 0, 0.6), 6px 12px 16px rgba(0, 0, 0, 0.45); }
  .box-face {
    position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='860' height='1560'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' seed='6'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.52  0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
      linear-gradient(165deg, #fbfbfa 0%, #f1f1ef 55%, #e3e3e1 100%);
    color: #202124;
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, sans-serif;
  }
  .box-face::before { /* the fold line of the end flap */
    content: ""; position: absolute; left: 0; right: 0; top: 168px; height: 2px;
    background: rgba(0, 0, 0, 0.12); box-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
  }
  .box-face::after { /* soft window light across the matte card */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 35%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.06) 100%);
  }
  .stripe { position: absolute; left: 0; right: 0; top: 0; height: 18px; background: linear-gradient(90deg, #5b4bd6, #8f6bff); }
  .content { position: absolute; left: 70px; right: 70px; top: 220px; }
  .wordmark { font-weight: 700; font-size: 34px; letter-spacing: 12px; }
  .product { margin-top: 18px; font-size: 52px; font-weight: 600; letter-spacing: -0.5px; }
  .variant { margin-top: 6px; font-size: 27px; color: #5f6368; }
  .specs { margin-top: 42px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; font-size: 24px; color: #3c4043; }
  .specs b { display: block; font-size: 20px; letter-spacing: 2px; color: #80868b; font-weight: 600; margin-bottom: 2px; }
  .barcode {
    position: absolute; left: 200px; top: 588px; width: 460px; padding: 26px 30px 16px;
    background: #fff; border-radius: 6px;
  }
  .barcode svg { width: 100%; height: auto; display: block; shape-rendering: crispEdges; }
  .barcode svg text { font-family: "Menlo", monospace; }
  .fine { position: absolute; left: 70px; right: 70px; top: 950px; font-size: 21px; line-height: 1.55; color: #6b6f75; }
  .serial { position: absolute; left: 70px; top: 1150px; width: 430px; }
  .serial svg { width: 100%; height: 90px; display: block; shape-rendering: crispEdges; }
  .serial div { font-family: "Menlo", monospace; font-size: 21px; margin-top: 8px; letter-spacing: 1px; color: #3c4043; }
  .recycle { position: absolute; right: 70px; top: 1170px; display: flex; gap: 16px; }
  .recycle span { width: 64px; height: 64px; border: 3px solid #5f6368; border-radius: 12px; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #5f6368; }

  .cable {
    position: absolute; left: -80px; top: 1500px; width: 1400px; height: 600px;
    border: 26px solid #d9dadc; border-color: #d9dadc transparent transparent transparent;
    border-radius: 50%; transform: rotate(-12deg); filter: blur(14px); opacity: 0.8;
  }
  .light { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 900px 1000px at 25% 20%, rgba(235, 242, 255, 0.18), rgba(235, 242, 255, 0) 70%),
      linear-gradient(160deg, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.3) 100%); }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 800px 1200px at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 100%); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' seed='8'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .dof { position: absolute; inset: 0; filter: blur(5px);
    -webkit-mask-image: radial-gradient(ellipse 600px 950px at 540px 950px, rgba(0,0,0,0) 66%, rgba(0,0,0,1) 100%);
            mask-image: radial-gradient(ellipse 600px 950px at 540px 950px, rgba(0,0,0,0) 66%, rgba(0,0,0,1) 100%); }
  .dof-far { position: absolute; inset: 0; filter: blur(18px);
    -webkit-mask-image: radial-gradient(ellipse 720px 1200px at 540px 950px, rgba(0,0,0,0) 74%, rgba(0,0,0,1) 100%);
            mask-image: radial-gradient(ellipse 720px 1200px at 540px 950px, rgba(0,0,0,0) 74%, rgba(0,0,0,1) 100%); }
</style>
</head>
<body>
<div class="frame" id="scene">
  <div class="desk"></div>
  <div class="box">
    <div class="box-shadow"></div>
    <div class="box-face">
      <div class="stripe"></div>
      <div class="content">
        <div class="wordmark">AURORA</div>
        <div class="product">Studio Headphones</div>
        <div class="variant">Over-ear · Graphite</div>
        <div class="specs">
          <div><b>MODEL</b>AH-40</div>
          <div><b>BATTERY</b>40 hours</div>
        </div>
      </div>
      <div class="barcode" data-code="ean">{{EAN_SVG}}</div>
      <div class="fine">
        Includes headphones, USB-C cable and travel case.<br>
        Designed in Copenhagen. Assembled in Vietnam.
      </div>
      <div class="serial" data-code="serial">{{SERIAL_SVG}}<div>S/N {{SERIAL}}</div></div>
      <div class="recycle"><span>♻</span><span>PAP</span></div>
    </div>
  </div>
  <div class="cable"></div>
  <div class="light"></div>
</div>
<div class="vignette"></div>
<div class="grain"></div>
<script>
  const scene = document.getElementById('scene');
  for (const cls of ['dof', 'dof-far']) {
    const copy = scene.cloneNode(true);
    copy.removeAttribute('id');
    const wrap = document.createElement('div');
    wrap.className = cls;
    wrap.appendChild(copy);
    scene.after(wrap);
  }
</script>
</body>
</html>
